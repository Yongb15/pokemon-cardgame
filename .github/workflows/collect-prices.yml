name: Collect prices

# Every linked card's prices, daily (docs/price/collect-all.md). Runs only on its schedule or by
# hand from main: the database secret lives in the `prices-production` environment, which only
# main may use. No pull_request triggers.
on:
  schedule:
    - cron: '30 19 * * *' # 04:30 KST, after the Vercel cron at 03:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: prices-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Install scripts don't run; the secret isn't in the environment yet at this step
      - run: npm ci --ignore-scripts
      - name: Collect
        env:
          PRICE_DATABASE_URL: ${{ secrets.PRICE_DATABASE_URL }}
        run: npx tsx scripts/collect-prices.ts
