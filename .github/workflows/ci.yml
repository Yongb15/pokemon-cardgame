name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

# Read-only token: this workflow only checks the code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The card-pack pool must be exactly what the card data gives (Security 7b (a))
      - run: node scripts/build-packs.mjs --check
      - run: npm run build
      - run: npm run build --workspace apps/api
      # Production dependencies only: dev-only findings (drizzle-kit's esbuild) are accepted
      - run: npm audit --omit=dev --audit-level=moderate
      # The billing kill switch is deployed on its own; if it breaks, nothing stops the spending (Security A-3)
      - run: npm audit --prefix infra/billing-guard --audit-level=moderate

  # Public pages in a real browser, against a local dev server only (docs/release/v1.17.0-design.md §1a)
  e2e-public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright comes from the lockfile; only its Chromium is downloaded (Security E-5)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:public
      # Screenshots of failures only: no traces, video or page bodies (Security E-4)
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-public-screenshots
          path: e2e-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore
